name: Multi-Cloud Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-pipeline:
    name: Terraform Provisioning Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract & Export Azure Credentials
        env:
          AZURE_CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDS" | jq -r '.clientId')" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDS" | jq -r '.clientSecret')" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDS" | jq -r '.subscriptionId')" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDS" | jq -r '.tenantId')" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Step 1 - Terraform Format Check
        run: |
          echo "Running terraform fmt check..."
          terraform -chdir=terraform_output fmt -check -diff || terraform -chdir=terraform_output fmt

      - name: Step 2 - Terraform Init
        run: |
          echo "Initializing Terraform modules and Azure provider plugins..."
          terraform -chdir=terraform_output init -backend=false

      - name: Step 3 - Terraform Validate
        run: |
          echo "Validating modular Terraform syntax..."
          terraform -chdir=terraform_output validate

      - name: Step 4 - Terraform Plan
        run: |
          echo "Generating Terraform execution plan for subscription: $ARM_SUBSCRIPTION_ID"
          terraform -chdir=terraform_output plan -no-color

      - name: Step 5 - Terraform Apply (Deployment to Azure Portal)
        run: |
          echo "Applying modular Terraform to Azure Subscription $ARM_SUBSCRIPTION_ID..."
          terraform -chdir=terraform_output apply -auto-approve
