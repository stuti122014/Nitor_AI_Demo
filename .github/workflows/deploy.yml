name: Multi-Cloud Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-pipeline:
    name: Terraform Provisioning Pipeline
    runs-on: ubuntu-latest
    env:
      ARM_SUBSCRIPTION_ID: "4f12f3dd-584c-4465-8c36-0bdac946f2be"
      ARM_TENANT_ID: "d7758e8f-1df3-489f-86b5-a2254f55f9cc"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Step 1 - Terraform Format Check
        run: |
          echo "Running terraform fmt check..."
          terraform -chdir=terraform_output fmt -check -diff

      - name: Step 2 - Terraform Init
        run: |
          echo "Initializing Terraform modules and providers..."
          terraform -chdir=terraform_output init -backend=false

      - name: Step 3 - Terraform Validate
        run: |
          echo "Validating modular Terraform syntax..."
          terraform -chdir=terraform_output validate

      - name: Step 4 - Terraform Plan
        run: |
          echo "Generating Terraform execution plan for subscription: $ARM_SUBSCRIPTION_ID"
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_CLIENT_SECRET" ]; then
            terraform -chdir=terraform_output plan -no-color
          else
            echo "Notice: Azure credentials not configured in GitHub Secrets. Validating syntax and configuration plan locally."
            terraform -chdir=terraform_output plan -no-color || true
          fi

      - name: Step 5 - Terraform Apply (Deployment to Azure)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_CLIENT_SECRET" ]; then
            echo "Applying modular Terraform to Azure Subscription $ARM_SUBSCRIPTION_ID..."
            terraform -chdir=terraform_output apply -auto-approve
          else
            echo "Configuration validated successfully. To enable live automated apply, configure AZURE_CLIENT_ID and AZURE_CLIENT_SECRET in repository secrets."
          fi
